name: Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      - name: Build
        run: pnpm run docs:build

    compatibility:
        runs-on: ubuntu-latest

        strategy:
          matrix:
            node-version: [ 18, 20, 22 ]

        continue-on-error: true

        steps:
          - uses: actions/checkout@v5

          - name: Setup pnpm
            uses: pnpm/action-setup@v6.0.5
            with:
              version: 9

          - name: Setup Node
            uses: actions/setup-node@v5
            with:
              node-version: ${{ matrix.node-version }}
              cache: 'pnpm'

          - name: Install deps
            run: pnpm install

          - name: Test build
            run: pnpm run docs:build